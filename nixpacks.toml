[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @trendforge/web run build"]

[start]
cmd = "find /app -name 'server.js' -path '*standalone*' && node $(find /app -name 'server.js' -path '*standalone*' | head -1)"
