version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: trendforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       ${POSTGRES_DB:-trendforge}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: trendforge-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout:  3s
      retries:  5

  api-gateway:
    build:
      context:    ..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: trendforge-api-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL:          postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-trendforge}
      REDIS_URL:             redis://:${REDIS_PASSWORD:-}@redis:6379
      REDIS_HOST:            redis
      REDIS_PASSWORD:        ${REDIS_PASSWORD:-}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO:      ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_AGENCY:   ${STRIPE_PRICE_AGENCY}
      JWT_SECRET:            ${JWT_SECRET}
      INTERNAL_API_SECRET:   ${INTERNAL_API_SECRET}
      PORT:                  3001
    ports:
      - '3001:3001'
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  ai-service:
    build:
      context:    ..
      dockerfile: apps/ai-service/Dockerfile
    container_name: trendforge-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL:   postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-trendforge}
      REDIS_URL:      redis://:${REDIS_PASSWORD:-}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  scraping-service:
    build:
      context:    ..
      dockerfile: apps/scraping-service/Dockerfile
    container_name: trendforge-scraper
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-trendforge}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker-notifications:
    build:
      context:    ..
      dockerfile: workers/notifications/Dockerfile
    container_name: trendforge-worker-notif
    restart: unless-stopped
    environment:
      DATABASE_URL:   postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-trendforge}
      REDIS_URL:      redis://:${REDIS_PASSWORD:-}@redis:6379
      REDIS_HOST:     redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  web:
    build:
      context:    ..
      dockerfile: apps/web/Dockerfile
    container_name: trendforge-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      API_GATEWAY_URL:     http://api-gateway:3001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_SECRET:          ${JWT_SECRET}
    ports:
      - '3000:3000'
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
